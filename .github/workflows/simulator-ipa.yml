name: Build simulator IPA

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]

jobs:
  simulator-ipa:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Confirm selected toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Resonance.xcodeproj \
            -scheme Resonance \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate the built .app
        id: locate
        run: |
          APP_PATH="$(find build/Build/Products -name 'Resonance.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Resonance.app not found under build/Build/Products"
            find build/Build/Products -maxdepth 3 -type d || true
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      - name: Zip the .app into an .ipa
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          mkdir -p build/ipa
          cd "$(dirname "$APP_PATH")"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_PATH")" \
            "$GITHUB_WORKSPACE/build/ipa/Resonance-simulator.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-simulator-ipa
          path: build/ipa/Resonance-simulator.ipa
          if-no-files-found: error
