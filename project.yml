name: Resonance
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Resonance:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Resonance
        excludes:
          - Resources
    resources:
      - path: Resonance/Resources
    info:
      path: Config/Info.plist
    entitlements:
      path: Config/Resonance.entitlements
    # Apply the shared xcconfig to every configuration the project uses.
    # XcodeGen's default configs are Debug and Release; the file's `//`
    # comments are valid xcconfig syntax as of Xcode 16.
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_NAME: Resonance
        # Sideload-friendly defaults: when `RESONANCE_DEVELOPMENT_TEAM`
        # is unset the archive still exports via the ad-hoc export
        # options plist (see build/export/ad-hoc.plist).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        # Modern Xcode refuses to import a Swift preview dylib into the
        # final IPA. Forcing this off keeps the embedded preview binary
        # from breaking AltStore's re-sign step.
        ENABLE_PREVIEWS: NO
  ResonanceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ResonanceTests
    dependencies:
      - target: Resonance
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        # Append ".tests" to whatever bundle ID the app was configured
        # with so users who override RESONANCE_BUNDLE_ID for sideloading
        # don't end up with a stale com.example.* test identifier.
        PRODUCT_BUNDLE_IDENTIFIER: $(RESONANCE_BUNDLE_ID).tests
schemes:
  Resonance:
    build:
      targets:
        Resonance: all
        ResonanceTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ResonanceTests
