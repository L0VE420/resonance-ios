name: Resonance
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Resonance:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Resonance
        excludes:
          - Resources
    resources:
      - path: Resonance/Resources
    info:
      path: Config/Info.plist
    entitlements:
      path: Config/Resonance.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.resonance
        PRODUCT_NAME: Resonance
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  ResonanceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ResonanceTests
    dependencies:
      - target: Resonance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.resonance.tests
schemes:
  Resonance:
    build:
      targets:
        Resonance: all
        ResonanceTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ResonanceTests
